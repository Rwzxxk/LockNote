<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LockNote</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="app" id="app">

    <!-- Barra lateral escondida (histórico de notas) -->
    <div class="backdrop" id="backdrop"></div>
    <aside class="drawer" id="drawer" aria-label="Histórico de notas">
      <header class="drawer-head">
        <span class="brand">LockNote</span>
        <button class="icon-btn" id="close-drawer" title="Fechar (Esc)" aria-label="Fechar">
          <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>

      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Buscar" autocomplete="off">
      </label>

      <div class="filters" role="group" aria-label="Filtrar">
        <button class="chip active" data-filter="all">Todas</button>
        <button class="chip icon" data-filter="text" title="Só texto" aria-label="Só texto">
          <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
        </button>
        <button class="chip icon" data-filter="code" title="Só código" aria-label="Só código">
          <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </button>
      </div>

      <ul id="note-list" class="note-list"></ul>
    </aside>

    <!-- Área principal -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="open-drawer" title="Notas" aria-label="Abrir histórico de notas">
          <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <span class="brand">LockNote</span>

        <span class="spacer"></span>

        <div class="note-tools" id="note-tools" hidden>
          <span id="status" class="status" aria-live="polite"></span>

          <select id="language" aria-label="Linguagem" hidden>
            <option value="">auto</option>
            <option value="bash">bash</option>
            <option value="c">c</option>
            <option value="cpp">c++</option>
            <option value="csharp">c#</option>
            <option value="css">css</option>
            <option value="go">go</option>
            <option value="haskell">haskell</option>
            <option value="xml">html</option>
            <option value="java">java</option>
            <option value="javascript">javascript</option>
            <option value="json">json</option>
            <option value="kotlin">kotlin</option>
            <option value="markdown">markdown</option>
            <option value="php">php</option>
            <option value="plaintext">texto</option>
            <option value="powershell">powershell</option>
            <option value="python">python</option>
            <option value="ruby">ruby</option>
            <option value="rust">rust</option>
            <option value="sql">sql</option>
            <option value="swift">swift</option>
            <option value="typescript">typescript</option>
            <option value="yaml">yaml</option>
          </select>

          <div class="kind-toggle" role="group" aria-label="Tipo da nota">
            <button data-kind="text" title="Texto" aria-label="Texto">
              <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
            </button>
            <button data-kind="code" title="Código" aria-label="Código">
              <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </button>
          </div>

          <button class="icon-btn" id="copy" title="Copiar código" aria-label="Copiar código" hidden>
            <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          </button>
          <button class="icon-btn danger" id="delete" title="Excluir nota" aria-label="Excluir nota">
            <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2"/></svg>
          </button>
        </div>

        <button class="icon-btn" id="new-note" title="Nova nota" aria-label="Nova nota">
          <svg viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
        </button>
      </header>

      <main class="page">
        <div id="empty" class="empty">
          <p>Nenhuma nota aberta.</p>
          <button class="link-btn" id="empty-new">Criar uma nota</button>
        </div>

        <div id="editor" class="editor" hidden>
          <input id="title" class="title" placeholder="Sem título" autocomplete="off">
          <div id="content-wrap" class="content-wrap">
            <pre id="highlight" aria-hidden="true"><code class="hljs"></code></pre>
            <textarea id="content" placeholder="Comece a escrever…"></textarea>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
